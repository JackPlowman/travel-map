name: "Setup Website Dependencies"
description: "Installs website dependencies for the project"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js with Cache
      uses: actions/setup-node@v7.1.0 # zizmor: ignore[unpinned-uses] Verified by the workflow lockfile.
      with:
        node-version-file: "website/package.json"
        cache: "npm"
        cache-dependency-path: "website/package-lock.json"
    - name: Set up Just
      uses: extractions/setup-just@v4.0.0 # zizmor: ignore[unpinned-uses] Verified by the workflow lockfile.
      with:
        just-version: "1.59.0"
    - name: Install website Dependencies
      shell: bash
      run: just website::install-ci
